name: Verify extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: npm ci
      - run: tmux -V && node --version
      - run: npm run verify
      - run: npm run test:integration
      - run: npm run test:agent-recovery
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:icons
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:reload
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:workspace-reload
      - run: npm run package
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vsix-${{ matrix.os }}
          path: |
            dist/*.vsix*
            test-results/*.json
